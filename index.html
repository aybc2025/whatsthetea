<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's the tea? ☕</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --text-main: #2c221e;
            --text-muted: #8c7a6b;
            --accent: #c86d51;
            --accent-light: #fbebe6;
            --border: #f0e6dd;
            --shadow: 0 20px 40px -15px rgba(74, 52, 40, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .container {
            max-width: 680px;
            width: 100%;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .steam-container {
            display: inline-block;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 50px -12px rgba(74, 52, 40, 0.1);
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-light);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.4rem 0.9rem;
            border-radius: 100px;
            margin-bottom: 1.5rem;
        }

        /* The main tea content styling */
        .tea-content {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 400;
        }

        .meta {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.25rem; }
            .card { padding: 2rem 1.5rem; }
            .tea-content { font-size: 1.35rem; }
            .meta { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="steam-container">☕</div>
            <h1>What's the tea?</h1>
        </header>

        <main class="card">
            <span class="badge">Freshly Spilled</span>
            
          <p>Instant Coffee - Tim Hortons</p> <br> 
            <div class="tea-content">
                "Word on the street is that coffee had its moment, but tea is taking over. Stay tuned for the latest gossip."
            </div>
            <!-- ============================================================== -->

            <div class="meta">
                <!-- ✏️ OPTIONAL: EDIT DATE & SOURCE HERE -->
                <span>Spilled: <strong style="color: var(--text-main);">September 10, 2026; 3:15 pm</strong></span>
              
            </div>
        </main>

        <footer>
            Served hot &bull; Check back for updates
        </footer>
    </div>

</body>
</html>
